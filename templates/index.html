<!DOCTYPE html>
<html lang="en">
<head>
	<!-- Google tag (gtag.js) -->
	<script async src="https://www.googletagmanager.com/gtag/js?id=G-FRLCJ4HKYS"></script>
	<script>
	  window.dataLayer = window.dataLayer || [];
	  function gtag(){dataLayer.push(arguments);}
	  gtag('js', new Date());

	  gtag('config', 'G-FRLCJ4HKYS');
	</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anagram Solver</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
<div class="container">
    <h1>Anagram Solver</h1>

    <input id="letters" type="text" placeholder="Enter letters…">
    	
	<label class="checkbox-row">
		<span>allow multi-word results</span>
		<input type="checkbox" id="multiword">
	</label>
	
	<button onclick="solve()">Find Anagrams</button>

    <div id="loading">Searching…</div>

    <div id="results-section" style="display:none;">
        <div class="results-title">Results</div>
        <div id="results"></div>
    </div>
</div>


<script>
    async function solve() {
        const letters = document.getElementById("letters").value.trim();
        const multiword = document.getElementById("multiword").checked;

        const resultsDiv = document.getElementById("results");
        const section = document.getElementById("results-section");
        const loading = document.getElementById("loading");

        if (!letters) {
            resultsDiv.innerHTML = "<div class='result'>Please enter letters.</div>";
            section.style.display = "block";
            return;
        }

        loading.style.display = "block";
        resultsDiv.innerHTML = "";
        section.style.display = "none";

        try {
            const response = await fetch(
                `/solve?letters=${encodeURIComponent(letters)}&multiword=${multiword}`
            );

            const data = await response.json();
			
			if (typeof gtag === "function") {
				gtag("event", "anagram_search", {
					multiword: multiword,
					query_length: letters.length,
					result_count: data.results ? data.results.length : 0
				});
			}

            loading.style.display = "none";

            if (!data.results || data.results.length === 0) {
                resultsDiv.innerHTML = "<div class='result'>No matches found.</div>";
            } else {
                resultsDiv.innerHTML = data.results
                    .map(w => `<div class="result">${w}</div>`)
                    .join("");
            }

            section.style.display = "block";

        } catch (err) {
            loading.style.display = "none";
            resultsDiv.innerHTML = "<div class='result'>Error contacting server.</div>";
            section.style.display = "block";
        }
    }

    document.getElementById("letters").addEventListener("keydown", function (e) {
        if (e.key === "Enter") solve();
    });
</script>
</body>
</html>
